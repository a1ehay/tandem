<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f5f6f4" />
    <title>Страница не найдена — Tandem</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f6f4; color: #202724; font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 440px; text-align: center; }
      .mark { display: inline-grid; width: 48px; height: 48px; place-items: center; border-radius: 15px; background: #24423a; color: #d6ef82; font-weight: 800; }
      h1 { margin: 18px 0 8px; font-size: 32px; letter-spacing: -1px; }
      p { color: #707a73; }
      a { display: inline-block; margin-top: 12px; padding: 11px 16px; border-radius: 10px; background: #24423a; color: white; text-decoration: none; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">t.</span>
      <h1>Страница не найдена</h1>
      <p>Возможно, ссылка устарела. Вернитесь в демо-пространство Tandem.</p>
      <a href="/">На главную</a>
    </main>
  </body>
</html>
