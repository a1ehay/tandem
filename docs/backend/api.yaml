openapi: 3.1.0
info:
  title: Tandem Java Core API
  version: 1.0.0
  summary: Target API for Tandem tutoring workspaces.
  license: { name: Proprietary, identifier: LicenseRef-Proprietary }
  description: |
    Target contract for Java Core under /api/v1. It replaces the earlier draft and
    is not a description of the deployed Cloudflare Worker. Java Core will own
    durable business data and authorization.

    It covers accounts, tutor-student links, lessons, tasks, planner, private notes,
    groups, messages, videos, files, subscriptions and LiveKit room tokens. Boards
    and realtime synchronization are deliberately outside this API version.

    PostgreSQL V1 needs new Flyway migrations before implementation: credentials and
    refresh sessions, email verification/change/reset tokens, OAuth identities, the
    free plan, groups, messages, files, videos and notes. Client-supplied IDs never
    prove resource access.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: Authentication, description: Registration, credentials, verification and OAuth. }
  - { name: Account, description: Current account profile and subscription. }
  - { name: Tutor students, description: Tutor-owned relationships with verified students. }
  - { name: Lessons, description: Scheduling, state transitions and authorized rooms. }
  - { name: Tasks, description: Personal tasks and student homework. }
  - { name: Planner and notes, description: Private workspace documents. }
  - { name: Collaboration, description: Groups and direct or group messages. }
  - { name: Learning materials, description: Video lessons and protected files. }
  - { name: Operations, description: Liveness and service health. }
paths:
  /auth/register:
    post:
      tags: [Authentication]
      security: []
      operationId: registerAccount
      summary: Register and send an email-verification link
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '429': { $ref: '#/components/responses/RateLimitProblem' }
  /auth/login:
    post:
      tags: [Authentication]
      security: []
      operationId: login
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: Access token and a rotated refresh cookie., headers: { Set-Cookie: { $ref: '#/components/headers/RefreshCookie' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '429': { $ref: '#/components/responses/RateLimitProblem' }
  /auth/refresh:
    post:
      tags: [Authentication]
      security: [{ refreshCookie: [] }]
      operationId: refreshAccessToken
      summary: Rotate refresh cookie and issue a new access token
      responses:
        '200': { description: New access token and rotated cookie., headers: { Set-Cookie: { $ref: '#/components/headers/RefreshCookie' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '401': { description: 'Missing, expired or revoked refresh cookie.', headers: { Set-Cookie: { $ref: '#/components/headers/ClearedRefreshCookie' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /auth/logout:
    post:
      tags: [Authentication]
      security: [{ refreshCookie: [] }]
      operationId: logout
      responses:
        '204': { description: Session revoked and refresh cookie cleared., headers: { Set-Cookie: { $ref: '#/components/headers/ClearedRefreshCookie' } } }
  /auth/email/verify:
    post:
      tags: [Authentication]
      security: []
      operationId: verifyEmail
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TokenRequest' } } } }
      responses: { '204': { description: Email verified. }, '400': { $ref: '#/components/responses/ValidationProblem' }, '409': { $ref: '#/components/responses/ConflictProblem' } }
  /auth/email/resend-verification:
    post:
      tags: [Authentication]
      security: []
      operationId: resendEmailVerification
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmailRequest' } } } }
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '429': { $ref: '#/components/responses/RateLimitProblem' } }
  /auth/password-reset/request:
    post:
      tags: [Authentication]
      security: []
      operationId: requestPasswordReset
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmailRequest' } } } }
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '429': { $ref: '#/components/responses/RateLimitProblem' } }
  /auth/password-reset/confirm:
    post:
      tags: [Authentication]
      security: []
      operationId: confirmPasswordReset
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetRequest' } } } }
      responses: { '204': { description: Password changed; all refresh sessions revoked. }, '400': { $ref: '#/components/responses/ValidationProblem' }, '409': { $ref: '#/components/responses/ConflictProblem' } }
  /auth/oauth/{provider}/start:
    get:
      tags: [Authentication]
      security: []
      operationId: startOAuth
      summary: Start browser OAuth authorization
      parameters: [{ $ref: '#/components/parameters/OAuthProvider' }]
      responses: { '302': { description: Redirect to provider. }, '404': { $ref: '#/components/responses/NotFoundProblem' }, '503': { $ref: '#/components/responses/ProviderNotConfiguredProblem' } }
  /auth/oauth/{provider}/callback:
    get:
      tags: [Authentication]
      security: []
      operationId: completeOAuth
      parameters: [{ $ref: '#/components/parameters/OAuthProvider' }]
      responses: { '302': { description: Redirect to application after completion. }, '400': { $ref: '#/components/responses/ValidationProblem' }, '503': { $ref: '#/components/responses/ProviderNotConfiguredProblem' } }
  /me:
    get:
      tags: [Account]
      operationId: getCurrentUser
      responses: { '200': { $ref: '#/components/responses/CurrentUser' }, '401': { $ref: '#/components/responses/UnauthorizedProblem' } }
    patch:
      tags: [Account]
      operationId: updateCurrentUser
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateProfileRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/CurrentUser' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '401': { $ref: '#/components/responses/UnauthorizedProblem' } }
  /me/email/change:
    post:
      tags: [Account]
      operationId: requestEmailChange
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmailRequest' } } } }
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '409': { $ref: '#/components/responses/ConflictProblem' } }
  /me/email/confirm:
    post:
      tags: [Account]
      operationId: confirmEmailChange
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TokenRequest' } } } }
      responses: { '204': { description: Email changed. }, '400': { $ref: '#/components/responses/ValidationProblem' }, '409': { $ref: '#/components/responses/ConflictProblem' } }
  /plans:
    get:
      tags: [Account]
      security: []
      operationId: listPlans
      summary: List product plans; billing is outside this API
      responses: { '200': { description: Catalogue., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Plan' } } } } } }
  /me/subscription:
    get:
      tags: [Account]
      operationId: getSubscription
      responses: { '200': { $ref: '#/components/responses/Subscription' }, '401': { $ref: '#/components/responses/UnauthorizedProblem' } }
  /tutor/students:
    get:
      tags: [Tutor students]
      operationId: listTutorStudents
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/TutorStudentPage' }, '403': { $ref: '#/components/responses/ForbiddenProblem' } }
    post:
      tags: [Tutor students]
      operationId: linkVerifiedStudent
      summary: Link tutor with an existing verified student by email
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateTutorStudentRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/TutorStudent' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '404': { $ref: '#/components/responses/NotFoundProblem' }, '409': { $ref: '#/components/responses/ConflictProblem' } }
  /tutor/students/{studentId}:
    get:
      tags: [Tutor students]
      operationId: getTutorStudent
      parameters: [{ $ref: '#/components/parameters/StudentId' }]
      responses: { '200': { $ref: '#/components/responses/TutorStudent' }, '404': { $ref: '#/components/responses/NotFoundProblem' } }
    patch:
      tags: [Tutor students]
      operationId: updateTutorStudent
      parameters: [{ $ref: '#/components/parameters/StudentId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateTutorStudentRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/TutorStudent' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '404': { $ref: '#/components/responses/NotFoundProblem' } }
    delete:
      tags: [Tutor students]
      operationId: unlinkTutorStudent
      parameters: [{ $ref: '#/components/parameters/StudentId' }]
      responses: { '204': { description: Link permanently removed. }, '404': { $ref: '#/components/responses/NotFoundProblem' } }
  /lessons:
    get:
      tags: [Lessons]
      operationId: listLessons
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/LessonStatus' }, { $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }]
      responses: { '200': { $ref: '#/components/responses/LessonPage' } }
    post:
      tags: [Lessons]
      operationId: createLesson
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateLessonRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Lesson' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '409': { $ref: '#/components/responses/ConflictProblem' } }
  /lessons/{lessonId}:
    get:
      tags: [Lessons]
      operationId: getLesson
      parameters: [{ $ref: '#/components/parameters/LessonId' }]
      responses: { '200': { $ref: '#/components/responses/Lesson' }, '404': { $ref: '#/components/responses/NotFoundProblem' } }
    patch:
      tags: [Lessons]
      operationId: updateLesson
      parameters: [{ $ref: '#/components/parameters/LessonId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateLessonRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Lesson' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '404': { $ref: '#/components/responses/NotFoundProblem' }, '409': { $ref: '#/components/responses/ConflictProblem' } }
  /lessons/{lessonId}/status:
    patch:
      tags: [Lessons]
      operationId: updateLessonStatus
      parameters: [{ $ref: '#/components/parameters/LessonId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateLessonStatusRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Lesson' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '404': { $ref: '#/components/responses/NotFoundProblem' }, '409': { $ref: '#/components/responses/ConflictProblem' } }
  /lessons/{lessonId}/room-token:
    post:
      tags: [Lessons]
      operationId: createLessonRoomToken
      summary: Issue a short-lived LiveKit token after server-side access checks
      parameters: [{ $ref: '#/components/parameters/LessonId' }]
      responses: { '200': { $ref: '#/components/responses/RoomToken' }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '404': { $ref: '#/components/responses/NotFoundProblem' }, '503': { $ref: '#/components/responses/ServiceUnavailableProblem' } }
  /tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/TaskStatus' }, { $ref: '#/components/parameters/TaskKind' }]
      responses: { '200': { $ref: '#/components/responses/TaskPage' } }
    post:
      tags: [Tasks]
      operationId: createTask
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateTaskRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Task' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' } }
  /tasks/{taskId}:
    get:
      tags: [Tasks]
      operationId: getTask
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses: { '200': { $ref: '#/components/responses/Task' }, '404': { $ref: '#/components/responses/NotFoundProblem' } }
    patch:
      tags: [Tasks]
      operationId: updateTask
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateTaskRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Task' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '404': { $ref: '#/components/responses/NotFoundProblem' } }
    delete:
      tags: [Tasks]
      operationId: archiveTask
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses: { '204': { description: Task archived. }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '404': { $ref: '#/components/responses/NotFoundProblem' } }
  /tasks/{taskId}/status:
    patch:
      tags: [Tasks]
      operationId: updateTaskStatus
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateTaskStatusRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Task' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '404': { $ref: '#/components/responses/NotFoundProblem' }, '409': { $ref: '#/components/responses/ConflictProblem' } }
  /tasks/{taskId}/copy:
    post:
      tags: [Tasks]
      operationId: copyTask
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CopyTaskRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Task' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '404': { $ref: '#/components/responses/NotFoundProblem' } }
  /planner:
    get:
      tags: [Planner and notes]
      operationId: getPlanner
      responses: { '200': { $ref: '#/components/responses/Planner' } }
    put:
      tags: [Planner and notes]
      operationId: replacePlanner
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePlannerRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Planner' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '409': { $ref: '#/components/responses/ConflictProblem' } }
  /notes:
    get:
      tags: [Planner and notes]
      operationId: listNotes
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/NotePage' } }
    post:
      tags: [Planner and notes]
      operationId: createNote
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NoteWriteRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Note' }, '400': { $ref: '#/components/responses/ValidationProblem' } }
  /notes/{noteId}:
    get:
      tags: [Planner and notes]
      operationId: getNote
      parameters: [{ $ref: '#/components/parameters/NoteId' }]
      responses: { '200': { $ref: '#/components/responses/Note' }, '404': { $ref: '#/components/responses/NotFoundProblem' } }
    patch:
      tags: [Planner and notes]
      operationId: updateNote
      parameters: [{ $ref: '#/components/parameters/NoteId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NoteWriteRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Note' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '404': { $ref: '#/components/responses/NotFoundProblem' } }
    delete:
      tags: [Planner and notes]
      operationId: deleteNote
      parameters: [{ $ref: '#/components/parameters/NoteId' }]
      responses: { '204': { description: Private note deleted. }, '404': { $ref: '#/components/responses/NotFoundProblem' } }
  /groups:
    get:
      tags: [Collaboration]
      operationId: listGroups
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/GroupPage' }, '403': { $ref: '#/components/responses/ForbiddenProblem' } }
    post:
      tags: [Collaboration]
      operationId: createGroup
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GroupWriteRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Group' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' } }
  /groups/{groupId}:
    get:
      tags: [Collaboration]
      operationId: getGroup
      parameters: [{ $ref: '#/components/parameters/GroupId' }]
      responses: { '200': { $ref: '#/components/responses/Group' }, '404': { $ref: '#/components/responses/NotFoundProblem' } }
    patch:
      tags: [Collaboration]
      operationId: updateGroup
      parameters: [{ $ref: '#/components/parameters/GroupId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GroupWriteRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Group' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '404': { $ref: '#/components/responses/NotFoundProblem' } }
    delete:
      tags: [Collaboration]
      operationId: deleteGroup
      parameters: [{ $ref: '#/components/parameters/GroupId' }]
      responses: { '204': { description: Group deleted. }, '404': { $ref: '#/components/responses/NotFoundProblem' } }
  /groups/{groupId}/members:
    put:
      tags: [Collaboration]
      operationId: replaceGroupMembers
      parameters: [{ $ref: '#/components/parameters/GroupId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StudentIdsRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Group' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '404': { $ref: '#/components/responses/NotFoundProblem' } }
  /messages:
    get:
      tags: [Collaboration]
      operationId: listMessages
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/CounterpartId' }, { $ref: '#/components/parameters/GroupQueryId' }]
      responses: { '200': { $ref: '#/components/responses/MessagePage' } }
    post:
      tags: [Collaboration]
      operationId: createMessage
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateMessageRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Message' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '404': { $ref: '#/components/responses/NotFoundProblem' } }
  /messages/{messageId}:
    delete:
      tags: [Collaboration]
      operationId: deleteMessage
      parameters: [{ $ref: '#/components/parameters/MessageId' }]
      responses: { '204': { description: Sender deleted message. }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '404': { $ref: '#/components/responses/NotFoundProblem' } }
  /videos:
    get:
      tags: [Learning materials]
      operationId: listVideos
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/VideoPage' } }
    post:
      tags: [Learning materials]
      operationId: createVideo
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VideoWriteRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Video' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' } }
  /videos/{videoId}:
    patch:
      tags: [Learning materials]
      operationId: updateVideo
      parameters: [{ $ref: '#/components/parameters/VideoId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VideoWriteRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Video' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '404': { $ref: '#/components/responses/NotFoundProblem' } }
    delete:
      tags: [Learning materials]
      operationId: deleteVideo
      parameters: [{ $ref: '#/components/parameters/VideoId' }]
      responses: { '204': { description: Video and assignments deleted. }, '404': { $ref: '#/components/responses/NotFoundProblem' } }
  /videos/{videoId}/assignments:
    put:
      tags: [Learning materials]
      operationId: replaceVideoAssignments
      parameters: [{ $ref: '#/components/parameters/VideoId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StudentIdsRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Video' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '404': { $ref: '#/components/responses/NotFoundProblem' } }
  /files:
    get:
      tags: [Learning materials]
      operationId: listFiles
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Folder' }]
      responses: { '200': { $ref: '#/components/responses/FilePage' } }
    post:
      tags: [Learning materials]
      operationId: uploadFile
      summary: Upload a library file up to 10 MiB
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: Maximum 10485760 bytes. }
                folder: { type: string, maxLength: 160, default: '' }
      responses: { '201': { $ref: '#/components/responses/File' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '413': { $ref: '#/components/responses/TooLargeProblem' }, '415': { $ref: '#/components/responses/UnsupportedMediaTypeProblem' } }
  /files/{fileId}:
    get:
      tags: [Learning materials]
      operationId: downloadFile
      summary: Download for owner, grantee or authorized message participant
      parameters: [{ $ref: '#/components/parameters/FileId' }]
      responses: { '200': { description: File stream with stored Content-Type and Content-Disposition. }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '404': { $ref: '#/components/responses/NotFoundProblem' } }
    delete:
      tags: [Learning materials]
      operationId: deleteFile
      parameters: [{ $ref: '#/components/parameters/FileId' }]
      responses: { '204': { description: File and grants permanently deleted. }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '404': { $ref: '#/components/responses/NotFoundProblem' } }
  /files/{fileId}/grants:
    put:
      tags: [Learning materials]
      operationId: replaceFileGrants
      parameters: [{ $ref: '#/components/parameters/FileId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StudentIdsRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/File' }, '400': { $ref: '#/components/responses/ValidationProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '404': { $ref: '#/components/responses/NotFoundProblem' } }
  /healthz:
    get:
      tags: [Operations]
      security: []
      operationId: healthz
      responses: { '200': { description: Process liveness without a database check. } }
  /actuator/health:
    get:
      tags: [Operations]
      security: []
      operationId: actuatorHealth
      responses: { '200': { description: Spring Boot health response. }, '503': { description: Required health contributor unavailable. } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT, description: Short-lived access token; refresh tokens are never accepted here. }
    refreshCookie: { type: apiKey, in: cookie, name: tandem_refresh, description: 'Secure, HttpOnly, SameSite=Lax token; rotated on refresh and cleared on logout.' }
  headers:
    RefreshCookie: { description: 'Rotated tandem_refresh cookie, Secure, HttpOnly, SameSite=Lax, Path=/api/v1/auth.', schema: { type: string } }
    ClearedRefreshCookie: { description: Expired tandem_refresh cookie with matching attributes., schema: { type: string } }
  parameters:
    Cursor: { name: cursor, in: query, schema: { type: string, maxLength: 512 }, description: Opaque cursor returned as nextCursor. }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    OAuthProvider: { name: provider, in: path, required: true, schema: { type: string, enum: [google, yandex, vk] }, description: Yandex and VK require runtime provider configuration. }
    StudentId: { name: studentId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    LessonId: { name: lessonId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    TaskId: { name: taskId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    NoteId: { name: noteId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    GroupId: { name: groupId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    MessageId: { name: messageId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    VideoId: { name: videoId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    FileId: { name: fileId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    LessonStatus: { name: status, in: query, schema: { $ref: '#/components/schemas/LessonStatus' } }
    TaskStatus: { name: status, in: query, schema: { $ref: '#/components/schemas/TaskStatus' } }
    TaskKind: { name: kind, in: query, schema: { $ref: '#/components/schemas/TaskKind' } }
    From: { name: from, in: query, schema: { type: string, format: date-time } }
    To: { name: to, in: query, schema: { type: string, format: date-time } }
    CounterpartId: { name: counterpartId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
    GroupQueryId: { name: groupId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
    Folder: { name: folder, in: query, schema: { type: string, maxLength: 160 } }
  responses:
    Accepted: { description: Accepted without disclosing email-account existence. }
    CurrentUser: { description: Current account., content: { application/json: { schema: { $ref: '#/components/schemas/CurrentUser' } } } }
    Subscription: { description: Current subscription., content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
    TutorStudent: { description: Tutor-student link., content: { application/json: { schema: { $ref: '#/components/schemas/TutorStudent' } } } }
    TutorStudentPage: { description: Cursor page., content: { application/json: { schema: { $ref: '#/components/schemas/TutorStudentPage' } } } }
    Lesson: { description: Lesson., content: { application/json: { schema: { $ref: '#/components/schemas/Lesson' } } } }
    LessonPage: { description: Cursor page., content: { application/json: { schema: { $ref: '#/components/schemas/LessonPage' } } } }
    Task: { description: Task., content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
    TaskPage: { description: Cursor page., content: { application/json: { schema: { $ref: '#/components/schemas/TaskPage' } } } }
    Planner: { description: Planner., content: { application/json: { schema: { $ref: '#/components/schemas/Planner' } } } }
    Note: { description: Private note., content: { application/json: { schema: { $ref: '#/components/schemas/Note' } } } }
    NotePage: { description: Cursor page., content: { application/json: { schema: { $ref: '#/components/schemas/NotePage' } } } }
    Group: { description: Student group., content: { application/json: { schema: { $ref: '#/components/schemas/Group' } } } }
    GroupPage: { description: Cursor page., content: { application/json: { schema: { $ref: '#/components/schemas/GroupPage' } } } }
    Message: { description: Message., content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
    MessagePage: { description: Cursor page., content: { application/json: { schema: { $ref: '#/components/schemas/MessagePage' } } } }
    Video: { description: Video lesson., content: { application/json: { schema: { $ref: '#/components/schemas/Video' } } } }
    VideoPage: { description: Cursor page., content: { application/json: { schema: { $ref: '#/components/schemas/VideoPage' } } } }
    File: { description: File metadata., content: { application/json: { schema: { $ref: '#/components/schemas/File' } } } }
    FilePage: { description: Cursor page., content: { application/json: { schema: { $ref: '#/components/schemas/FilePage' } } } }
    RoomToken: { description: LiveKit credential., content: { application/json: { schema: { $ref: '#/components/schemas/RoomToken' } } } }
    ValidationProblem: { description: Invalid input., content: { application/problem+json: { schema: { $ref: '#/components/schemas/ValidationProblem' } } } }
    UnauthorizedProblem: { description: Invalid access token., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    ForbiddenProblem: { description: Insufficient role or resource access., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NotFoundProblem: { description: Resource absent or invisible., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    ConflictProblem: { description: 'State, relation or unique-value conflict.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    RateLimitProblem: { description: Rate limit exceeded., headers: { Retry-After: { schema: { type: integer }, description: Seconds until retry. } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    TooLargeProblem: { description: Request or upload too large., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    UnsupportedMediaTypeProblem: { description: Unsupported file content type., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    ServiceUnavailableProblem: { description: Required service unavailable or unconfigured., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
