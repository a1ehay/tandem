    LoginRequest: { type: object, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string, format: password, writeOnly: true } } }
    EmailRequest: { type: object, required: [email], properties: { email: { type: string, format: email, maxLength: 254 } } }
    TokenRequest: { type: object, required: [token], properties: { token: { type: string, minLength: 1, maxLength: 512 } } }
    PasswordResetRequest: { type: object, required: [token, password], properties: { token: { type: string, minLength: 1, maxLength: 512 }, password: { type: string, format: password, minLength: 8, maxLength: 128, writeOnly: true } } }
    AuthResponse: { type: object, required: [accessToken, tokenType, expiresIn, user], properties: { accessToken: { type: string }, tokenType: { type: string, const: Bearer }, expiresIn: { type: integer, minimum: 1 }, user: { $ref: '#/components/schemas/CurrentUser' } } }
